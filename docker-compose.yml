version: '3.8'

services:
  ml-api:
    build: .
    container_name: ml-classification-api
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./static:/app/static
      - ./templates:/app/templates
    environment:
      - FLASK_ENV=production
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ml-api-2:
    build: .
    container_name: ml-classification-api-2
    ports:
      - "5001:5000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./static:/app/static
      - ./templates:/app/templates
    environment:
      - FLASK_ENV=production
      - PORT=5000
    restart: unless-stopped

  ml-api-3:
    build: .
    container_name: ml-classification-api-3
    ports:
      - "5002:5000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./static:/app/static
      - ./templates:/app/templates
    environment:
      - FLASK_ENV=production
      - PORT=5000
    restart: unless-stopped

